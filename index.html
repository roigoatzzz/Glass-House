<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLASS HOUSE // ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #0a0a0a; color: #fff; }
        .img-container { background: #111; position: relative; overflow: hidden; aspect-ratio: 16/9; }
        .img-container img { transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1); filter: saturate(0.8) brightness(0.8); }
        .img-container:hover img { transform: scale(1.08); filter: saturate(1.1) brightness(1.1); }
        .glass-ui { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); opacity: 0; transition: opacity 0.3s ease; }
        .img-container:hover .card-label { opacity: 1; }
    </style>
</head>
<body>

    <nav class="glass-ui sticky top-0 z-50 px-8 py-5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <span class="tracking-[0.3em] font-bold text-sm">GLASS HOUSE // v2.0</span>
        </div>
        <div id="counter" class="font-mono text-[10px] text-zinc-500">000 // FILES</div>
    </nav>

    <main id="main-grid" class="max-w-[1800px] mx-auto p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Images injected here -->
    </main>

    <script>
        async function loadArchive() {
            try {
                const res = await fetch('wallpapers.json');
                const data = await res.json();
                const grid = document.getElementById('main-grid');
                let count = 0;

                data.forEach(cat => {
                    cat.images.forEach(img => {
                        count++;
                        const card = `
                            <div class="group">
                                <div class="img-container rounded-lg border border-zinc-800">
                                    <img src="${img.url}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/111/333?text=Link+Broken'">
                                    <div class="card-label">
                                        <p class="text-xs font-bold truncate mb-2 uppercase tracking-tighter">${img.name}</p>
                                        <div class="flex justify-between items-center">
                                            <span class="text-[9px] text-zinc-400 font-mono">${cat.category}</span>
                                            <a href="${img.url}" target="_blank" class="text-[10px] bg-white text-black px-3 py-1 rounded-full font-bold hover:bg-zinc-200 transition">RAW</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += card;
                    });
                });
                document.getElementById('counter').innerText = `${count.toString().padStart(3, '0')} // FILES_DETECTED`;
            } catch (e) {
                console.error("Archive fetch failed.");
            }
        }
        loadArchive();
    </script>
</body>
</html>
