<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallpaper Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .img-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="bg-zinc-900 text-white font-sans">

    <!-- Header -->
    <header class="p-10 text-center">
        <h1 class="text-5xl font-bold tracking-tighter">THE VAULT</h1>
        <p class="text-zinc-400 mt-2">Curated high-res backgrounds</p>
    </header>

    <!-- Gallery Container -->
    <main id="gallery" class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Wallpapers will be injected here -->
    </main>

    <script>
        async function loadWallpapers() {
            const response = await fetch('wallpapers.json');
            const categories = await response.json();
            const gallery = document.getElementById('gallery');

            categories.forEach(cat => {
                cat.images.forEach(img => {
                    const card = `
                        <div class="img-card relative overflow-hidden rounded-xl bg-zinc-800 group">
                            <img src="${img.url}" alt="${img.name}" class="w-full h-64 object-cover transition duration-500 loading="lazy"">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                                <a href="${img.url}" target="_blank" download class="bg-white text-black px-4 py-2 rounded-full font-bold text-sm">Download</a>
                            </div>
                            <div class="p-3 text-xs text-zinc-500 uppercase tracking-widest">${cat.category}</div>
                        </div>
                    `;
                    gallery.innerHTML += card;
                });
            });
        }

        loadWallpapers();
    </script>
</body>
</html>
